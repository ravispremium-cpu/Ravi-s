    # Webhook Payloads
    EvolutionApiWebhookPayload:
      type: object
      description: Payload enviado pela Evolution API v2 para eventos de WhatsApp
      properties:
        event:
          type: string
          example: "messages.upsert"
        instance:
          type: string
          example: "ravis-canoinhas-matriz"
        data:
          type: object
          properties:
            key:
              type: object
              properties:
                remoteJid:
                  type: string
                  example: "5547991234567@s.whatsapp.net"
                fromMe:
                  type: boolean
                  example: false
                id:
                  type: string
                  example: "3EB0C81F2874"
            pushName:
              type: string
              example: "Dr. Guilherme Schramm"
            message:
              type: object
              properties:
                conversation:
                  type: string
                  example: "Gostei muito do tricô off-white! Vou ficar com ele e a calça chino."

    InstagramWebhookPayload:
      type: object
      description: Payload enviado pela Meta Graph API para Direct Messages
      properties:
        object:
          type: string
          example: "instagram"
        entry:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "17841400000000000"
              messaging:
                type: array
                items:
                  type: object
                  properties:
                    sender:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "48291048201"
                    message:
                      type: object
                      properties:
                        mid:
                          type: string
                        text:
                          type: string
                          example: "Vocês tem aquele sobretudo em lã batida no tamanho M?"

    PaymentGatewayWebhookPayload:
      type: object
      description: Payload de confirmação de pagamento do Mercado Pago ou Stripe
      properties:
        action:
          type: string
          example: "payment.updated"
        type:
          type: string
          example: "payment"
        data:
          type: object
          properties:
            id:
              type: string
              example: "1234567890"
            status:
              type: string
              example: "approved"
            external_reference:
              type: string
              example: "PED-2026-1042"
            transaction_amount:
              type: number
              example: 769.00
            payment_method_id:
              type: string
              example: "pix"
