          example: 2
        returnedCount:
          type: integer
          example: 2
        totalPurchasedAmount:
          type: number
          example: 769.00
        generatedOrderId:
          type: string
          format: uuid
          example: "6f5e4d3c-2b1a-0f9e-8d7c-6b5a4f3e2d1c"
        curatorCommissionAmount:
          type: number
          example: 38.45
        stockReconciledCount:
