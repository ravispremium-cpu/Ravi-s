          items:
            type: string
            format: uri
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantDetail'

    ProductVariantDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: "RAV-TRC-03-M-OFF"
        size:
          type: string
          example: "M"
        colorName:
          type: string
          example: "Off-White"
        colorHex:
          type: string
          example: "#F5F5DC"
        stockPhysical:
          type: integer
          example: 3
        stockReserved:
          type: integer
          example: 1
        stockAvailable:
          type: integer
          example: 2
        isLimitedEdition:
          type: boolean
          example: true

    CreateProductRequest:
      type: object
      required: [code, name, category, costPrice, retailPrice, variants]
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        costPrice:
          type: number
        retailPrice:
          type: number
        variants:
          type: array
          items:
            type: object
            required: [sku, size, colorName, stockPhysical]
            properties:
              sku:
                type: string
              size:
                type: string
              colorName:
                type: string
              stockPhysical:
                type: integer

    ConditionalBoxDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "COND-2026-088"
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
          example: "Dr. Guilherme Schramm"
        curatorId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CRIADO, EM_PREPARACAO, ENVIADO, EM_TESTE, FINALIZADO, CANCELADO, VENCIDO]
          example: EM_TESTE
        sentAt:
          type: string
          format: date-time
        deadlineDate:
          type: string
          format: date-time
        durationDays:
          type: integer
          example: 3
        totalAmount:
          type: number
          example: 1849.00
        itemsCount:
          type: integer
          example: 4
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConditionalItemDetail'

    ConditionalItemDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        productName:
          type: string
          example: "Camiseta Slim Algodão Egípcio Preto"
        sku:
          type: string
          example: "RAV-CSL-01-M-BLK"
        size:
          type: string
          example: "M"
        unitPrice:
          type: number
          example: 280.00
        status:
          type: string
          enum: [EM_EXPERIMENTACAO, COMPRADO, DEVOLVIDO]
          example: EM_EXPERIMENTACAO
        returnReason:
          type: string
          nullable: true

    # ==========================================================================
    # PAYLOAD CENTRAL: MONTAR SELEÇÃO E ENVIAR PARA O CLIENTE
    # ==========================================================================
    AssembleAndSendRequest:
      type: object
      description: Payload executado pelo Curador para validar estoque, reservar peças e despachar a mala VIP
      required: [curatorId, items, testDurationDays]
      properties:
        curatorId:
          type: string
          format: uuid
          description: ID do Curador responsável pela montagem
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        deliveryMethod:
          type: string
          enum: [LEVA_E_TRAZ_VIP, RETIRADA_LOJA, CORREIOS_SEDEX]
          default: LEVA_E_TRAZ_VIP
          example: LEVA_E_TRAZ_VIP
        testDurationDays:
          type: integer
          minimum: 1
          maximum: 7
          default: 3
          description: Período acordado para experimentação (padrão Ravi's é 3 dias)
          example: 3
        dispatchNotes:
          type: string
          description: Orientações para a mala ou cartão manuscrito VIP
          example: "Seleção montada com 4 peças em linho e modal sob medida para conferência médica."
        items:
          type: array
          minItems: 1
          maxItems: 12
          description: Lista de variantes de peças selecionadas para envio na mala
          items:
            type: object
            required: [variantId]
            properties:
              variantId:
                type: string
                format: uuid
                description: ID da variante específica (tamanho/cor) a reservar
                example: "4b87cf31-7e8e-4752-b88e-c1cfc14b3011"
              specialPriceOverride:
                type: number
                nullable: true
                description: Desconto especial ou ajuste de preço aprovado pelo curador
                example: 489.00
              stylingTip:
                type: string
                description: Dica do curador para o cliente combinar a peça
                example: "Harmonize este tricô modal off-white com a calça chino tech chumbo."
        notification:
          type: object
          description: Opções de disparo imediato no WhatsApp do cliente
          properties:
            sendWhatsAppImmediately:
              type: boolean
              default: true
              example: true
            customWhatsAppMessage:
              type: string
              nullable: true
              description: Mensagem customizada; se omitida, usa o template aprovado Ravi's Curadoria
              example: "Olá Dr. Guilherme! Acabamos de preparar sua seleção exclusiva Ravi's. Nosso motorista VIP levará até seu consultório hoje às 14h."

    AssembleAndSendResponse:
      type: object
      properties:
        boxId:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        code:
          type: string
          example: "COND-2026-088"
        status:
          type: string
          example: "ENVIADO"
        totalAmount:
          type: number
          example: 1849.00
        itemsCount:
          type: integer
          example: 4
        reservedItems:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
                example: "RAV-TRC-03-M-OFF"
              productName:
                type: string
                example: "Tricô Modal Canelado Off-White"
              stockRemainingAvailable:
                type: integer
                example: 1
        dispatchTrackingUrl:
          type: string
          format: uri
          example: "https://ravispremium.com.br/condicional/COND-2026-088"
        whatsAppDispatched:
          type: boolean
          example: true
        whatsAppMessageId:
          type: string
          example: "wamid.HBgLNTU0Nzk5MTIzNDU2NxUCABEYEjA1"
        scheduledReminderAt:
          type: string
          format: date-time
          example: "2026-10-15T10:00:00-03:00"

    RegisterReturnRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          description: Decisão final para cada peça da mala
          items:
            type: object
            required: [itemId, decision]
            properties:
              itemId:
                type: string
                format: uuid
              decision:
                type: string
                enum: [COMPRADO, DEVOLVIDO]
              returnReason:
                type: string
                nullable: true
                example: "Ficou folgado na cintura, prefere caimento 40"
        paymentMethod:
          type: string
          enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, LINK_MERCADO_PAGO, LINK_STRIPE]
          default: PIX
        commissionCuratorRate:
          type: number
          default: 0.05
          description: Taxa de comissão do curador (ex: 5% = 0.05)

    RegisterReturnResponse:
