          nullable: true
        pixCopyPasteKey:
          type: string
          nullable: true
          example: "00020126580014br.gov.bcb.pix0136123e4567-e89b-12d3-a456-4266141740005204000053039865802BR5925RAVIS PREMIUM MENSWEAR6009CANOINHAS62070503***6304E8A1"
        paymentLinkUrl:
          type: string
          format: uri
          nullable: true
          example: "https://mpago.la/pos/293810238"

    ConversationDetail:
      type: object
