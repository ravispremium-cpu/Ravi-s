          format: date-time

    CreateOrderRequest:
      type: object
      required: [customerId, channel, items, paymentMethod]
      properties:
        customerId:
          type: string
          format: uuid
        sellerUserId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [ONLINE_WHATSAPP, PDV_FISICO_CANOINHAS, ECOMMERCE]
        paymentMethod:
          type: string
          enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, LINK_MERCADO_PAGO, LINK_STRIPE]
